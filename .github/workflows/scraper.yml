name: Scrape Wind Data

on:
  schedule:
    - cron: '7,24,41 * * * *'  # Runs at :07, :27, :47 past every hour
  workflow_dispatch:        # Enables manual trigger button

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright pandas
          playwright install --with-deps chromium

      - name: Run scraper
        run: python scraper.py

      - name: Commit and push CSV updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add porto_pollo_wind_history.csv
          git commit -m "Auto-update wind data [skip ci]" || exit 0
          git push
